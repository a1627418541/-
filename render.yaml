services:
  - type: web
    name: virtual-girlfriend-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build && npx prisma generate
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false  # 在 Render Dashboard 手动设置
      - key: JWT_SECRET
        sync: false  # 在 Render Dashboard 手动设置
      - key: AI_PROVIDER
        value: doubao
      - key: AI_API_KEY
        sync: false  # 在 Render Dashboard 手动设置
      - key: AI_BASE_URL
        sync: false  # 在 Render Dashboard 手动设置
      - key: AI_MODEL
        value: doubao-seed-2-0-lite-260215
