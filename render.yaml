services:
  - type: web
    name: virtual-girlfriend-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build && npx prisma generate
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false  # 在 Render Dashboard 手动设置
      - key: JWT_SECRET
        sync: false  # 在 Render Dashboard 手动设置
      - key: AI_PROVIDER
        value: doubao
      - key: AI_API_KEY
        sync: false  # 在 Render Dashboard 手动设置
      - key: AI_BASE_URL
        sync: false  # 在 Render Dashboard 手动设置
      - key: AI_MODEL
        value: doubao-seed-2-0-lite-260215
      - key: DASHSCOPE_API_KEY
        sync: false  # 在 Render Dashboard 手动设置（千问万相生图API密钥）
      - key: DASHSCOPE_IMAGE_MODEL
        value: qwen-image-2.0-pro
      - key: R2_ENDPOINT
        sync: false  # 在 Render Dashboard 手动设置
      - key: R2_ACCESS_KEY_ID
        sync: false  # 在 Render Dashboard 手动设置
      - key: R2_SECRET_ACCESS_KEY
        sync: false  # 在 Render Dashboard 手动设置
      - key: R2_BUCKET_NAME
        sync: false  # 在 Render Dashboard 手动设置
      - key: R2_PUBLIC_URL
        sync: false  # 在 Render Dashboard 手动设置
